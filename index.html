<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>お問い合わせフォーム</title>
</head>
<body>
    <h1>メッセージを送る</h1>

    <!-- actionhttps://formspree.io/f/xaenadpzのURLを自分のFormspreeのURLに変更します -->
    <form  method="POST">
        <label>
            お名前:
            <input type="text" name="name" required>
        </label>
        <br><br>
        <label>
            メールアドレス:
            <input type="email" name="_replyto" required>
        </label>
        <br><br>
        <label>
            メッセージ:
            <textarea name="message" required></textarea>
        </label>
        <br><br>
        <button type="submit">送信する</button>
    </form>
</body>
</html>
